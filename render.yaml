# Render Blueprint for the ART-LAVKA API (NestJS, in /backend).
# Secrets (sync:false) are set in the Render dashboard, not committed.
services:
  - type: web
    name: art-lavka-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      - key: MOCK_SMS
        value: "true"
      - key: PAYMENTS_SANDBOX
        value: "true"
      # Telegram OTP delivery (optional) — set in the dashboard.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Cloudinary signed uploads (designer print artwork) — set in the dashboard.
      - key: USE_CLOUDINARY
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
