name: artlavka_client
description: "ART-LAVKA — customer app: browse, order, pay, track, rate."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Localization (RU/UZ/EN) message formatting.
  intl: any

  # Shared models / services / theme / utils.
  artlavka_core:
    path: ../../packages/artlavka_core

  # State management (controllers + immutable state per feature).
  flutter_riverpod: ^2.6.1
  # Routing with auth/onboarding redirect guards.
  go_router: ^14.6.0
  # Cached, sized mockup images in catalog/product lists.
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the launcher icons from the logo.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # Generate localizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  assets:
    - assets/logo/
    - assets/banners/
    - assets/products/
    - assets/prints/

# Launcher icon config — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/artlavka_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#F7F4EF"
  adaptive_icon_foreground: "assets/logo/artlavka_logo.png"
