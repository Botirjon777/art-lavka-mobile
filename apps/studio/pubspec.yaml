name: artlavka_studio
description: "ART-LAVKA Studio — seller app: onboard, upload prints, stats, withdraw."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any

  # Shared models / services / theme / utils.
  artlavka_core:
    path: ../../packages/artlavka_core

  # State management (controllers + immutable state per feature).
  flutter_riverpod: ^2.6.1
  # Routing with the KYC verification redirect gate.
  go_router: ^14.6.0
  # Cached preview/mockup images in uploads/stats.
  cached_network_image: ^3.4.1
  # Pick a print image from the device for upload.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/

# Launcher icon config — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/artlavka_studio_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#F7F4EF"
  adaptive_icon_foreground: "assets/logo/artlavka_studio_logo.png"
