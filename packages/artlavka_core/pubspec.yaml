name: artlavka_core
description: >-
  Shared core for the ART-LAVKA apps: models, services, repositories, theme,
  and utils. Holds NO screen widgets so it stays testable and reusable.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # REST client (base URL, JWT interceptor) — talks to the NestJS backend.
  dio: ^5.7.0
  # Secure storage for JWT access/refresh tokens.
  flutter_secure_storage: ^9.2.2
  # @immutable / annotations for model classes.
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No assets/fonts here — the apps own their assets. Theme tokens are code.
